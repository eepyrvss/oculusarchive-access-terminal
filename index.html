<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Secure Access Terminal</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;700&display=swap">
<style>
:root{--bg:#111214;--panel:#1b1e22;--edge:#c4c8ce;--dim:#8b9097;--cy:#9de8ff;--rd:#ff6161;--gr:#7dff9a;color-scheme:dark;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:#f2f2f2;font:14px/1.6 "JetBrains Mono","Courier New",monospace;min-height:100vh;display:grid;place-items:center;padding:24px 16px}
.wrap{width:min(560px,100%)}
.logo{display:block;width:64px;height:auto;margin:0 auto 16px}
.status{font-size:10px;color:var(--dim);letter-spacing:.06em;text-align:center;margin-bottom:10px}
.box{border:1px solid var(--edge);background:var(--panel);padding:26px 24px}
h1{margin:0 0 6px;font-size:clamp(20px,5vw,28px);font-weight:500;letter-spacing:.08em;text-align:center}
.sub{color:var(--cy);font-size:12px;text-align:center;letter-spacing:.1em;margin-bottom:8px}
label{display:block;color:var(--cy);font-size:11px;letter-spacing:.14em;margin:18px 0 6px}
input{width:100%;background:#0b0c0d;border:1px solid #3a3f45;color:#fff;font:inherit;padding:10px 12px;letter-spacing:.08em;outline:0}
input:focus{border-color:var(--cy)}
input.bad{border-color:var(--rd)}
.err{color:var(--rd);font-size:11px;letter-spacing:.06em;min-height:1.4em;margin-top:6px}
button{margin-top:18px;width:100%;background:var(--cy);color:#14181b;border:0;padding:12px;font:inherit;font-weight:700;letter-spacing:.2em;cursor:pointer}
button:disabled{opacity:.6;cursor:wait}
.ok{display:none}
.ok h2{margin:0 0 10px;color:var(--gr);font-size:16px;letter-spacing:.08em;font-weight:500}
.ok a{display:inline-block;margin-top:14px;background:var(--cy);color:#14181b;padding:10px 16px;font-weight:700;letter-spacing:.14em;text-decoration:none}
.foot{font-size:10px;color:var(--dim);text-align:center;margin-top:14px}
</style>
</head>
